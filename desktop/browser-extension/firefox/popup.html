<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
        color: #eeebe1;
        background: #0f0f0d;
      }
      h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: .5px; }
      h2 { font: 600 11px ui-monospace, Consolas, monospace; letter-spacing: 1px; color: #b5b1a4; margin: 16px 0 8px; }
      label { display: block; margin: 10px 0 4px; color: #b5b1a4; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 5px;
        border: 1px solid #4a4840;
        background: #181815;
        color: #eeebe1;
      }
      button {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #000;
        background: #c6f135;
        color: #0f0f0d;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 0 #5e7314;
      }
      button:active { transform: translateY(2px); box-shadow: none; }
      #save { margin-top: 12px; width: 100%; }
      #state { color: #b5b1a4; }
      .ok { color: #c6f135; }
      .bad { color: #ff8a80; }
      p { color: #b5b1a4; margin: 10px 0 0; }
      label.row { display: flex; gap: 8px; align-items: center; color: #eeebe1; }
      label.row input { width: auto; }
      .media { display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 6px;
        border: 1px solid #2b2a25; border-radius: 6px; background: #181815; }
      .media .info { flex: 1; min-width: 0; }
      .media .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .media .meta { font: 11px ui-monospace, Consolas, monospace; color: #b5b1a4; margin-top: 2px; }
      .media button { padding: 5px 9px; font-size: 12px; }
      .empty { color: #817d71; font-size: 12px; }
      details summary { cursor: pointer; color: #b5b1a4; margin-top: 16px; }
    </style>
  </head>
  <body>
    <h1>1 download manager</h1>
    <div id="state">checking the app…</div>

    <h2>MEDIA ON THIS PAGE</h2>
    <div id="media"><div class="empty">Play the video and its streams show up here.</div></div>

    <details>
      <summary>Connection and capture</summary>
      <label for="port">App port</label>
      <input id="port" type="number" />

      <label for="token">Pairing code (only if it does not connect by itself)</label>
      <input id="token" type="text" autocomplete="off" />

      <label class="row"><input id="auto" type="checkbox" /> Catch every download the browser starts</label>
      <button id="save">Save and test</button>
    </details>

    <p>
      Video players get a Download key in their corner. When the app is closed the
      browser downloads as usual.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
