org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Single source of truth for the app version, shared by the Android APK and the
# Windows installer. The desktop MSI needs a plain numeric version.
appVersion=2.2.11

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 compatibility, temporary: keep the separate Kotlin plugin and the old DSL until the
# app is moved to AGP's built-in Kotlin. Both opt-outs are removed in AGP 10.
android.builtInKotlin=false
android.newDsl=false
